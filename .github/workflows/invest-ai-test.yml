name: INVEST AI Daily Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Log pipeline run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          cat > pipeline.py << 'PY'
          import requests

          URL = "${{ secrets.SUPABASE_URL }}"
          KEY = "${{ secrets.SUPABASE_SECRET_KEY }}"

          headers = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}",
              "Content-Type": "application/json"
          }

          payload = {
              "assets_with_prices": 40,
              "indicators_generated": 38,
              "scores_generated": 38,
              "opportunities_generated": 10
          }

          r = requests.post(
              f"{URL}/rest/v1/pipeline_runs",
              headers=headers,
              json=payload
          )

          print(r.status_code)
          print(r.text)
          PY

          python pipeline.py
