name: INVEST AI Full Load

on:
  workflow_dispatch:

jobs:
  load-prices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance requests pandas

      - name: Load all assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python << 'EOF'
          import requests
          import yfinance as yf

          url = f"{'${{ secrets.SUPABASE_URL }}'}/rest/v1/assets?select=id,ticker"

          headers = {
              "apikey": "${{ secrets.SUPABASE_SECRET_KEY }}",
              "Authorization": "Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"
          }

          assets = requests.get(url, headers=headers).json()

          market_suffix = {
              "SAN":"SAN.MC",
              "BBVA":"BBVA.MC",
              "CABK":"CABK.MC",
              "BKT":"BKT.MC",
              "IBE":"IBE.MC",
              "REP":"REP.MC",
              "NTGY":"NTGY.MC",
              "RED":"RED.MC",
              "ENG":"ENG.MC",
              "ITX":"ITX.MC",
              "AMS":"AMS.MC",
              "AENA":"AENA.MC",
              "TEF":"TEF.MC"
          }

          inserted = 0

          for asset in assets:

              ticker = market_suffix.get(asset["ticker"], asset["ticker"])

              try:
                  df = yf.Ticker(ticker).history(period="5d")

                  if len(df) == 0:
                      continue

                  latest = df.iloc[-1]

                  payload = {
                      "asset_id": asset["id"],
                      "trading_date": str(df.index[-1].date()),
                      "open_price": float(latest["Open"]),
                      "high_price": float(latest["High"]),
                      "low_price": float(latest["Low"]),
                      "close_price": float(latest["Close"]),
                      "adjusted_close": float(latest["Close"]),
                      "volume": int(latest["Volume"])
                  }

                  r = requests.post(
                      f"{'${{ secrets.SUPABASE_URL }}'}/rest/v1/asset_prices",
                      headers={
                          "apikey":"${{ secrets.SUPABASE_SECRET_KEY }}",
                          "Authorization":"Bearer ${{ secrets.SUPABASE_SECRET_KEY }}",
                          "Content-Type":"application/json",
                          "Prefer":"resolution=ignore-duplicates"
                      },
                      json=payload
                  )

                  if r.status_code in (200, 201):
                      inserted += 1

                  print(ticker, r.status_code)

              except Exception as e:
                  print(ticker, e)

          print("INSERTED =", inserted)
          EOF
