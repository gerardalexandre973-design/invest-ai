name: INVEST AI Technical Indicators

on:
  workflow_dispatch:

jobs:
  indicators:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas

      - name: Generate SMA indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python << 'EOF'
          import requests
          import pandas as pd

          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_SECRET_KEY }}"

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}"
          }

          assets = requests.get(
              f"{SUPABASE_URL}/rest/v1/assets?select=id",
              headers=headers
          ).json()

          processed = 0

          for asset in assets:

              asset_id = asset["id"]

              prices = requests.get(
                  f"{SUPABASE_URL}/rest/v1/asset_prices?asset_id=eq.{asset_id}&select=trading_date,close_price&order=trading_date",
                  headers=headers
              ).json()

              if len(prices) < 200:
                  continue

              df = pd.DataFrame(prices)

              df["close_price"] = pd.to_numeric(df["close_price"])

              sma20 = df["close_price"].tail(20).mean()
              sma50 = df["close_price"].tail(50).mean()
              sma100 = df["close_price"].tail(100).mean()
              sma200 = df["close_price"].tail(200).mean()

              last_date = df.iloc[-1]["trading_date"]

              payload = {
                  "asset_id": asset_id,
                  "indicator_date": last_date,
                  "sma20": float(sma20),
                  "sma50": float(sma50),
                  "sma100": float(sma100),
                  "sma200": float(sma200)
              }

              r = requests.post(
                  f"{SUPABASE_URL}/rest/v1/technical_indicators",
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Content-Type": "application/json"
                  },
                  json=payload
              )

              if r.status_code in (200,201):
                  processed += 1

          print("PROCESSED =", processed)

          EOF
