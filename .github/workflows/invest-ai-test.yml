name: INVEST AI Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "Testing connection configuration"
          echo "URL length:"
          echo ${#SUPABASE_URL}
          echo "Secret key length:"
          echo ${#SUPABASE_SECRET_KEY}

      - name: Count assets pending update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          RESPONSE=$(curl -s \
          "${SUPABASE_URL}/rest/v1/asset_update_queue?status=eq.PENDING&select=id" \
          -H "apikey: ${SUPABASE_SECRET_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}")

          COUNT=$(echo "$RESPONSE" | grep -o "\"id\"" | wc -l)

          echo "PENDING_COUNT=$COUNT" >> $GITHUB_ENV

          echo "Assets pending update: $COUNT"

      - name: Insert queue status log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PENDING_COUNT: ${{ env.PENDING_COUNT }}
        run: |
          curl -s \
          -X POST \
          "${SUPABASE_URL}/rest/v1/data_update_log" \
          -H "apikey: ${SUPABASE_SECRET_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=representation" \
          -d "{
            \"status\":\"QUEUE_TEST\",
            \"imported_rows\":${PENDING_COUNT},
            \"notes\":\"Assets pending update\"
          }"
