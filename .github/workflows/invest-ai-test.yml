name: INVEST AI Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Read Iberdrola and save latest price
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python << 'EOF'
          import yfinance as yf
          import requests

          ASSET_ID = None

          response = requests.get(
              f"{'${{ secrets.SUPABASE_URL }}'}/rest/v1/assets?ticker=eq.IBE&select=id",
              headers={
                  "apikey": "${{ secrets.SUPABASE_SECRET_KEY }}",
                  "Authorization": "Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"
              }
          )

          ASSET_ID = response.json()[0]["id"]

          print("ASSET_ID:", ASSET_ID)

          df = yf.Ticker("IBE.MC").history(period="5d")

          latest = df.iloc[-1]

          payload = {
              "asset_id": ASSET_ID,
              "trading_date": str(df.index[-1].date()),
              "open_price": float(latest["Open"]),
              "high_price": float(latest["High"]),
              "low_price": float(latest["Low"]),
              "close_price": float(latest["Close"]),
              "adjusted_close": float(latest["Close"]),
              "volume": int(latest["Volume"])
          }

          response = requests.post(
              f"{'${{ secrets.SUPABASE_URL }}'}/rest/v1/asset_prices",
              headers={
                  "apikey": "${{ secrets.SUPABASE_SECRET_KEY }}",
                  "Authorization": "Bearer ${{ secrets.SUPABASE_SECRET_KEY }}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation"
              },
              json=payload
          )

          print(response.status_code)
          print(response.text)
          EOF
