name: INVEST AI RSI Engine

on:
  workflow_dispatch:

jobs:
  rsi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Calculate RSI14
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          cat > rsi.py << 'PY'
          import requests
          import pandas as pd

          URL = "${{ secrets.SUPABASE_URL }}"
          KEY = "${{ secrets.SUPABASE_SECRET_KEY }}"

          headers = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}"
          }

          indicators = requests.get(
              f"{URL}/rest/v1/technical_indicators?select=*",
              headers=headers
          ).json()

          updated = 0

          for row in indicators:

              asset_id = row["asset_id"]

              prices = requests.get(
                  f"{URL}/rest/v1/asset_prices?asset_id=eq.{asset_id}&select=close_price&order=trading_date",
                  headers=headers
              ).json()

              if len(prices) < 15:
                  continue

              df = pd.DataFrame(prices)

              close = pd.to_numeric(df["close_price"])

              delta = close.diff()

              gain = delta.where(delta > 0, 0).rolling(14).mean()
              loss = (-delta.where(delta < 0, 0)).rolling(14).mean()

              rs = gain / loss
              rsi = 100 - (100 / (1 + rs))

              latest_rsi = float(rsi.iloc[-1])

              r = requests.patch(
                  f"{URL}/rest/v1/technical_indicators?asset_id=eq.{asset_id}",
                  headers={
                      "apikey": KEY,
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json"
                  },
                  json={"rsi14": latest_rsi}
              )

              if r.status_code in (200, 204):
                  updated += 1

          print("UPDATED =", updated)
          PY

          python rsi.py
