              "Authorization": f"Bearer {KEY}"
          }

          data = requests.get(
              f"{URL}/rest/v1/vw_pipeline_master_data?select=*",
              headers=headers
          ).json()[0]

          process_date = str(data["process_date"])

          insert_headers = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}",
              "Content-Type": "application/json",
