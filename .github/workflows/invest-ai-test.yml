name: INVEST AI Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: |
          pip install yfinance

      - name: Read Iberdrola price
        run: |
          python - << 'EOF'
          import yfinance as yf

          ticker = yf.Ticker("IBE.MC")

          df = ticker.history(period="5d")

          latest = df.iloc[-1]

          print("LATEST CLOSE:", latest["Close"])
          print("LATEST VOLUME:", latest["Volume"])

          print(df.tail())
          EOF
