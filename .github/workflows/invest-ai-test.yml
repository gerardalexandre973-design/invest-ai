name: INVEST AI Technical Indicators V2

on:
  workflow_dispatch:

jobs:
  indicators:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas numpy

      - name: Generate indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          cat > indicators.py << 'PY'
          import requests
          import pandas as pd

          URL = "${{ secrets.SUPABASE_URL }}"
          KEY = "${{ secrets.SUPABASE_SECRET_KEY }}"

          headers = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}"
          }

          assets = requests.get(
              f"{URL}/rest/v1/assets?select=id",
              headers=headers
          ).json()

          generated = 0

          for asset in assets:

              asset_id = asset["id"]

              prices = requests.get(
                  f"{URL}/rest/v1/asset_prices?asset_id=eq.{asset_id}&select=trading_date,close_price&order=trading_date",
                  headers=headers
              ).json()

              if len(prices) < 200:
                  continue

              df = pd.DataFrame(prices)

              close = pd.to_numeric(df["close_price"])

              sma20 = close.rolling(20).mean().iloc[-1]
              sma50 = close.rolling(50).mean().iloc[-1]
              sma100 = close.rolling(100).mean().iloc[-1]
              sma200 = close.rolling(200).mean().iloc[-1]

              ema12 = close.ewm(span=12, adjust=False).mean()
              ema26 = close.ewm(span=26, adjust=False).mean()

              macd = ema12 - ema26
              macd_signal = macd.ewm(span=9, adjust=False).mean()

              delta = close.diff()

              gain = delta.clip(lower=0)
              loss = -delta.clip(upper=0)

              avg_gain = gain.rolling(14).mean()
              avg_loss = loss.rolling(14).mean()

              if avg_loss.iloc[-1] == 0:
                  continue

              rs = avg_gain / avg_loss
              rsi14 = (100 - (100 / (1 + rs))).iloc[-1]

              payload = {
                  "asset_id": asset_id,
                  "indicator_date": str(df.iloc[-1]["trading_date"]),
                  "sma20": round(float(sma20),4),
                  "sma50": round(float(sma50),4),
                  "sma100": round(float(sma100),4),
                  "sma200": round(float(sma200),4),
                  "ema12": round(float(ema12.iloc[-1]),4),
                  "ema26": round(float(ema26.iloc[-1]),4),
                  "macd": round(float(macd.iloc[-1]),4),
                  "macd_signal": round(float(macd_signal.iloc[-1]),4),
                  "rsi14": round(float(rsi14),2)
              }

              r = requests.post(
                  f"{URL}/rest/v1/technical_indicators",
                  headers={
                      "apikey": KEY,
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "resolution=ignore-duplicates"
                  },
                  json=payload
              )

              if r.status_code in (200,201):
                  generated += 1

              print(asset_id, r.status_code)

          print("GENERATED =", generated)
          PY

          python indicators.py
