name: INVEST AI Score Engine

on:
  workflow_dispatch:

jobs:
  scores:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas

      - name: Generate Scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python << 'EOF'
          import requests

          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_SECRET_KEY }}"

          headers = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}"
          }

          indicators = requests.get(
              f"{URL}/rest/v1/technical_indicators?select=*",
              headers=headers
          ).json()

          generated = 0

          for row in indicators:

              score = 0

              if row["sma20"] > row["sma50"]:
                  score += 30

              if row["sma50"] > row["sma100"]:
                  score += 30

              if row["sma100"] > row["sma200"]:
                  score += 40

              payload = {
                  "asset_id": row["asset_id"],
                  "score_date": row["indicator_date"],
                  "technical_score": score,
                  "total_score": score,
                  "confidence_score": 70
              }

              r = requests.post(
                  f"{URL}/rest/v1/scores",
                  headers={
                      "apikey": KEY,
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "resolution=ignore-duplicates"
                  },
                  json=payload
              )

              if r.status_code in (200,201):
                  generated += 1

          print("GENERATED =", generated)

          EOF
