name: INVEST AI Pipeline V5

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update System Metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          cat > pipeline_v5.py << 'PY'
          import requests
          from datetime import date

          URL = "${{ secrets.SUPABASE_URL }}"
          KEY = "${{ secrets.SUPABASE_SECRET_KEY }}"

          headers = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}"
          }

          metrics = requests.get(
              f"{URL}/rest/v1/vw_live_metrics?select=*",
              headers=headers
          ).json()[0]

          payload = {
              "metric_date": str(date.today()),
              "total_assets": metrics["total_assets"],
              "assets_with_prices": metrics["assets_with_prices"],
              "technical_indicators": metrics["technical_indicators"],
              "scores": metrics["scores"],
              "opportunities": metrics["opportunities"],
              "strong_buy": metrics["strong_buy"]
          }

          response = requests.post(
              f"{URL}/rest/v1/system_metrics",
              headers={
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation"
              },
              json=payload
          )

          print(response.status_code)
          print(response.text)
          PY

          python pipeline_v5.py
